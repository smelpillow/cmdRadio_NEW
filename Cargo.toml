[package]
name = "cmdradio"
version = "0.3.5"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rodio = { version = "0.20", default-features = false, features = ["mp3", "symphonia-aac", "symphonia-vorbis"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.9"
